const ZIP_CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t})();

 const u16=(view,p,v)=>view.setUint16(p,v,true),u32=(view,p,v)=>view.setUint32(p,v>>>0,true);
 for(const [name,data] of files){
  const fn=enc.encode(name),crc=zipCRC(data),lh=new Uint8Array(30+fn.length),lv=new DataView(lh.buffer);

  parts.push(lh,data);
  const ch=new Uint8Array(46+fn.length),cv=new DataView(ch.buffer);
  u32(cv,0,0x02014b50);u16(cv,4,20);u16(cv,6,20);u16(cv,8,0x0800);u32(cv,16,crc);u32(cv,20,data.length);u32(cv,24,data.length);u16(cv,28,fn.length);u32(cv,42,offset);ch.set(fn,46);central.push(ch);
  offset+=lh.length+data.length;
 }
 const centralSize=central.reduce((n,p)=>n+p.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);

}

  try{const r=await fetch(c[f]);if(!r.ok)continue;files.push([c.id+'-'+f+'.png',new Uint8Array(await r.arrayBuffer())]);}catch(e){}
 }
 if(!files.length){alert('다운로드할 이미지 파일을 찾지 못했어요.');return;}
 const url=URL.createObjectURL(makeClubZip(files)),a=document.createElement('a');
 a.href=url;a.download=c.id+'-original-assets.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}

function render(){const c=CLUBS[current];document.documentElement.style.setProperty('--team',c.color);$('selector').innerHTML=CLUBS.map((t,i)=>`<button type="button" class="${i===current?'active':''}" aria-pressed="${i===current}" data-index="${i}">${safe(t.ko.split(' ')[1])}</button>`).join('');$('selector').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.index));const logo=c.logo?`<img class="logo wolves-main-logo" src="${safe(c.logo)}" alt="${safe(c.ko)} 공식 로고" onerror="this.style.opacity='.08';this.title='이미지를 폴더에 넣어주세요'">`:`<div class="logo-empty"><span>${c.icon}</span>공식 로고 삽입 예정</div>`;
$('sheet').innerHTML=`<div class="mast"><div class="mast-top"><span>CLUB PROFILE / ${String(current+1).padStart(2,'0')}</span><span>${safe(c.city)} · EST. ${safe(c.year)}</span></div><div class="mast-grid"><div><div class="ko">${safe(c.ko)}</div><h2>${safe(c.en)}</h2><p class="motto${/[가-힣]/.test(c.motto)?' ko-slogan':''}">${safe(c.motto)}</p></div>${logo}</div></div><div class="content"><div class="stats"><div class="stat"><b>${safe(c.titles)}</b><span>한국시리즈 우승</span></div><div class="stat"><b>${safe(c.pennants)}</b><span>페넌트레이스 우승</span></div><div class="stat"><b>${safe(c.postseason)}</b><span>포스트시즌 진출</span></div></div><section class="section"><div class="section-head">01 / CLUB IDENTITY</div><p class="body-copy">${safe(c.identity)}</p></section><section class="section"><div class="section-head">02 / PLAY STYLE</div><p class="body-copy">${safe(c.play)}</p><div class="chips">${c.tags.map(t=>`<span class="chip">#${safe(t)}</span>`).join('')}</div></section><section class="section"><div class="section-head">03 / CLUB IMAGE & FANDOM</div><div class="two"><div class="feature"><strong>CLUB IMAGE</strong><p>${safe(c.clubimage)}</p></div><div class="feature"><strong>FANDOM</strong><p>${safe(c.fandom)}</p></div></div></section><section class="section"><div class="section-head">04 / CLUB INFORMATION</div><table class="info"><tbody>${[['창단',c.year+'년'],['연고지',c.ko.split(' ')[0]],['홈구장',c.home],['모기업',c.parent],['키트 스폰서',c.sponsor]].filter(([k,v])=>v).map(([k,v])=>`<tr><th>${safe(k)}</th><td>${safe(v)}</td></tr>`).join('')}</tbody></table></section>${`<section class="section"><div class="section-head">05 / CLUB PARTNERS</div><div class="partners-grid"><div class="partner-tile"><span class="partner-kicker">PARENT COMPANY</span><div class="partner-image"><img src="${safe(c.companyLogo)}" alt="${safe(c.parent)} 기업 로고" onerror="this.style.visibility='hidden'"></div><span class="partner-name">${safe(c.parent)}</span></div><div class="partner-tile"><span class="partner-kicker">KIT SUPPLIER</span><div class="partner-image"><img src="${safe(c.sponsorLogo)}" alt="${safe(c.sponsor)} 키트 스폰서 로고" onerror="this.style.visibility='hidden'"></div><span class="partner-name">${safe(c.sponsor)}</span></div></div></section>`}${`<section class="section"><div class="section-head">06 / CLUB MARKS</div><div class="media wolves-marks marks-${c.id}">${media(c.symbol,'심볼 마크','🐺','symbol')}${media(c.wordmark,'워드마크','⚾','wordmark')}</div></section>`}<section class="section"><div class="section-head">07 / UNIFORM & DETAILS</div><div class="media wolves-uniforms">${media(c.uniform,'홈 · 원정 유니폼','👕')}${media(c.details,'모자 · 유니폼 디테일','⚾')}</div>${c.markingFont?`<div class="marking-font"><span class="marking-font-label">UNIFORM MARKING FONT</span><strong>${safe(c.markingFont)}</strong></div>`:''}</section>${downloadCenter(c)}</div><div class="footer"><span>BEYOND THE NINTH</span><span>${String(current+1).padStart(2,'0')} / ${CLUBS.length}</span></div>`;
$('prev').disabled=current===0;$('next').disabled=current===CLUBS.length-1;try{history.replaceState(null,'','#'+c.id)}catch(e){}
}
function go(i){if(i<0||i>=CLUBS.length)return;current=i;render();window.scrollTo({top:0,behavior:'smooth'})}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);const hash=location.hash.slice(1);const found=CLUBS.findIndex(c=>c.id===hash);if(found>=0)current=found;render();window.addEventListener('hashchange',()=>{const i=CLUBS.findIndex(c=>c.id===location.hash.slice(1));if(i>=0&&i!==current){current=i;render()}});
</script></body></html>
